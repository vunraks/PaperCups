<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - EcoCups</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Eco<span>Cups</span></a>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="products.html">Товары</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="contacts.html">Контакты</a></li>
                <li><a href="register.html">Регистрация</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-form">
            <h1>Вход в аккаунт</h1>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" name="password" required>
                    <a href="forgot-password.html" class="forgot-password">Забыли пароль?</a>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <label for="remember-me">Запомнить меня</label>
                </div>
                
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
            
            <div class="social-login">
                <p>Или войдите через:</p>
                <div class="social-buttons">
                    <button class="btn-social google">
                        <img src="images/devicon_google (1).png" alt="Google">
                        Google
                    </button>
                    <button class="btn-social facebook">
                        <img src="images/logos_facebook.png" alt="Facebook">
                        Facebook
                    </button>
                </div>
            </div>
            
            <div class="auth-links">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </div>
        </div>
        
        <div class="auth-benefits">
            <h2>С возвращением!</h2>
            <p>Войдите в свой аккаунт, чтобы получить доступ к персональным скидкам и истории заказов.</p>

        </div>
    </main>

    <footer>
        <p>&copy; 2023 EcoCups. Все права защищены.</p>
    </footer>

    <script src="auth.js"></script>
</body>
</html>
