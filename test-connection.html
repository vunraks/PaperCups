<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест подключения - EcoCups</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Тест подключения к серверу</h1>
    
    <button onclick="testConnection()">Проверить подключение</button>
    <button onclick="testProducts()">Проверить товары</button>
    <button onclick="testRegister()">Тест регистрации</button>
    
    <div id="results"></div>

    <script>
        const API_BASE_URL = "http://127.0.0.1:8000/api";
        
        function addResult(message, isSuccess = true) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${isSuccess ? 'success' : 'error'}`;
            resultDiv.textContent = message;
            resultsDiv.appendChild(resultDiv);
        }
        
        async function testConnection() {
            try {
                const response = await fetch(`${API_BASE_URL}/test/`);
                const data = await response.json();
                addResult(`✅ Сервер отвечает: ${data.message}`);
            } catch (error) {
                addResult(`❌ Ошибка подключения: ${error.message}`, false);
            }
        }
        
        async function testProducts() {
            try {
                const response = await fetch(`${API_BASE_URL}/products/`);
                const data = await response.json();
                addResult(`✅ Товары загружены: ${data.length} товаров`);
            } catch (error) {
                addResult(`❌ Ошибка загрузки товаров: ${error.message}`, false);
            }
        }
        
        async function testRegister() {
            try {
                const response = await fetch(`${API_BASE_URL}/register/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'test_user',
                        email: 'test@test.com',
                        phone: '1234567890',
                        password: 'test123',
                        password2: 'test123'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ Регистрация работает: ${data.user.username}`);
                } else {
                    const error = await response.json();
                    addResult(`⚠️ Регистрация: ${error.error}`, false);
                }
            } catch (error) {
                addResult(`❌ Ошибка регистрации: ${error.message}`, false);
            }
        }
        
        // Автоматически проверить подключение при загрузке
        window.onload = function() {
            addResult('🔍 Проверяем подключение к серверу...');
            testConnection();
        };
    </script>
</body>
</html>
