g<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест API - EcoCups</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 4px; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>Тест API EcoCups</h1>
    
    <div class="test-section">
        <h2>Тест сервера</h2>
        <button onclick="testServer()">Проверить сервер</button>
        <div id="server-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Тест товаров</h2>
        <button onclick="testProducts()">Получить товары</button>
        <div id="products-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Тест регистрации</h2>
        <button onclick="testRegister()">Тест регистрации</button>
        <div id="register-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Тест входа</h2>
        <button onclick="testLogin()">Тест входа</button>
        <div id="login-result" class="result"></div>
    </div>

    <script>
        const API_BASE_URL = "http://127.0.0.1:8000/api";
        
        async function makeRequest(url, method, body = null) {
            const headers = {
                "Content-Type": "application/json",
            };

            const token = localStorage.getItem("access_token");
            if (token) {
                headers["Authorization"] = `Bearer ${token}`;
            }

            const config = {
                method,
                headers,
            };

            if (body) {
                config.body = JSON.stringify(body);
            }

            try {
                const response = await fetch(`${API_BASE_URL}${url}`, config);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.detail || `HTTP ${response.status}: Ошибка сервера`);
                }

                return data;
            } catch (error) {
                console.error("API Error:", error);
                throw error;
            }
        }
        
        function showResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.className = `result ${isError ? 'error' : 'success'}`;
            element.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }
        
        async function testServer() {
            try {
                const result = await makeRequest("/test/", "GET");
                showResult("server-result", result);
            } catch (error) {
                showResult("server-result", { error: error.message }, true);
            }
        }
        
        async function testProducts() {
            try {
                const result = await makeRequest("/products/", "GET");
                showResult("products-result", result);
            } catch (error) {
                showResult("products-result", { error: error.message }, true);
            }
        }
        
        async function testRegister() {
            try {
                const formData = {
                    username: "testuser",
                    email: "test@example.com",
                    phone: "+7 999 123-45-67",
                    password: "password123",
                    password2: "password123"
                };
                
                const result = await makeRequest("/register/", "POST", formData);
                showResult("register-result", result);
            } catch (error) {
                showResult("register-result", { error: error.message }, true);
            }
        }
        
        async function testLogin() {
            try {
                const formData = {
                    email: "test@test.com",
                    password: "password"
                };
                
                const result = await makeRequest("/login/", "POST", formData);
                showResult("login-result", result);
            } catch (error) {
                showResult("login-result", { error: error.message }, true);
            }
        }
    </script>
</body>
</html>
