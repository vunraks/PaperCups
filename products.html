<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары - EcoCups</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">EcoCups</div>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="products.html" class="active">Товары</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="contacts.html">Контакты</a></li>
                <li><a href="cart.html">Корзина (<span id="cart-count">0</span>)</a></li>
                <li><a href="login.html" class="auth-link" id="login-link">Войти</a></li>
                <li><a href="register.html" class="auth-link" id="register-link">Регистрация</a></li>
                <li><a href="profile.html" class="protected" id="profile-link" style="display:none">Личный кабинет</a></li>
                <li><a href="#" class="protected" id="logout-link" style="display:none">Выйти</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Наша продукция</h1>
        
        <div class="products" id="products-list"></div>
    </main>

    <footer>
        <p>&copy; 2025 EcoCups. Все права защищены.</p>
    </footer>
    <script src="app.js"></script>
    <script>
    (async function loadProductsPage(){
      try {
        const res = await fetch(`${API_BASE_URL}/products/`);
        const products = await res.json();
        const container = document.getElementById('products-list');
        container.innerHTML = products.map(p => `
          <div class="product">
            <img src="${p.image_url || 'images/cup1.png'}" alt="${p.name}">
            <h3>${p.name}</h3>
            <p>Цена: ${p.price} руб./шт</p>
            <button class="add-to-cart" data-id="${p.id}" data-name="${p.name}" data-price="${p.price}">В корзину</button>
          </div>
        `).join('');
      } catch (e) {
        const container = document.getElementById('products-list');
        container.innerHTML = '<p>Не удалось загрузить товары.</p>';
      }
    })();
    </script>
</body>
</html>
